<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F198 mock-up: Plant an idea before Coming seeds</title>
<style>
  /* The dashboard's own tokens and rules (factory_dashboard/static/dashboard.css), dark theme */
  :root {
    --floor: #12161b; --bay: #181e25; --plate: #1f2730; --grid: #222b34; --rule: #303b47;
    --fg: #dfe4e8; --ink-2: #b4bec8; --muted: #8794a2;
    --hazard: #f2b10a; --hazard-ink: #1a1405; --opus: #ff9640; --good: #5fd17a; --good-ink: #5fd17a; --sonnet: #ffc48a;
    --stripe: repeating-linear-gradient(-45deg, var(--hazard) 0 6px, transparent 6px 12px);
    --notch: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    --display: "Chakra Petch", "Bahnschrift", system-ui, sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; color: var(--fg); font: 15px/1.5 var(--body); background-color: var(--floor);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px; }
  h1 { margin: 0 0 4px; font: 700 20px var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .lede { margin: 0; max-width: 820px; color: var(--ink-2); }
  .switch { display: inline-flex; margin: 12px 0; border: 1px solid var(--rule); }
  .switch button { min-height: 44px; padding: 0 18px; font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase;
    background: var(--bay); color: var(--muted); border: 0; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--hazard); color: var(--hazard-ink); }
  .versions { display: grid; gap: 22px; }
  .version { min-width: 0; }
  .version > h2 { margin: 0 0 8px; padding: 6px 10px; display: flex; align-items: center; gap: 10px;
    background: var(--plate); border: 1px solid var(--rule); font: 600 14px var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .version > h2::after { content: ""; flex: 1; height: 8px; background: var(--stripe); opacity: .5; }
  .frame-name { margin: 14px 0 6px; font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .phone { width: 360px; max-width: 100%; }
  @media (min-width: 900px) {
    .switch { display: none; }
    .versions { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .version[hidden] { display: block !important; }
  }
  [hidden] { display: none !important; }

  /* The marks: what this card changes */
  .changed { outline: 2px dashed var(--good); outline-offset: 2px; }
  .mark-note { margin: 6px 0 0; padding: 4px 8px; font: 600 11.5px var(--mono); color: var(--good); border-left: 3px solid var(--good); }

  /* ---- the page, as planning.html draws it ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .tile { background: var(--bay); padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .tile h3 { margin: 0; font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tile p { margin: 0; }
  .tile .small { font: 11.5px var(--mono); color: var(--muted); }
  .meter { height: 12px; background: var(--floor); border: 1px solid var(--rule); position: relative; }
  .meter > span { position: absolute; inset: 1px auto 1px 1px; background: var(--good); }
  .meter > .mark { inset: -4px auto -4px 75%; width: 2px; background: var(--fg); }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; margin-top: 14px; }
  .wide .row { flex-wrap: nowrap; }
  .plant-column { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .plant { flex: 1 1 280px; min-width: 0; background: var(--bay); border: 1px solid var(--rule); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .plant-column .plant { flex: none; }
  .plant h2, .desk > h2 { margin: 0; font: 600 14px var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .plant label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
  .plant textarea { font: 15px var(--body); color: var(--fg); background: var(--floor); border: 1px solid var(--rule); padding: 9px 10px; }
  .buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .status { font-size: 12.5px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase; min-height: 44px; padding: 0 16px; border: 0; }
  .btn.go { background: var(--hazard); color: var(--hazard-ink); clip-path: var(--notch); }
  .btn.plain { background: transparent; color: var(--fg); border: 1px solid var(--rule); }
  .coming { margin-top: 14px; background: var(--bay); border: 1px dashed var(--hazard); }
  .plant-column .coming { margin-top: 0; }
  .coming > h2 { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--rule); font: 600 14px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--hazard); }
  .coming .slot { padding: 10px 14px; border-bottom: 1px solid var(--grid); }
  .item { display: flex; flex-direction: column; padding: 7px 9px; background: var(--plate); border: 1px solid var(--rule); min-height: 44px; }
  .item b { font-weight: 400; font-size: 14px; }
  .item span { font: 11.5px var(--mono); color: var(--muted); }
  .desk { flex: 999 1 420px; min-width: 0; background: var(--bay); border: 1px solid var(--rule); }
  .desk > h2 { padding: 10px 14px; border-bottom: 1px solid var(--rule); }
  .group { padding: 10px 14px; border-bottom: 1px solid var(--grid); display: flex; flex-direction: column; gap: 6px; }
  .group h3 { margin: 0; font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--hazard); }
</style>
</head>
<body>
<h1>F198: Plant an idea stays put, Coming seeds goes under it</h1>
<p class="lede"><code>/planning</code> with one plant on its way. The values are today's page; the plant is your own note on this card. Nothing here can be pressed.</p>
<div class="switch" role="group" aria-label="Which version">
  <button type="button" data-show="today" aria-pressed="false">Today</button>
  <button type="button" data-show="proposed" aria-pressed="true">Proposed</button>
</div>

<div class="versions">
  <section class="version" data-version="today" hidden>
    <h2>Today</h2>
    <div class="frame-name">Phone</div><div class="phone" data-layout="today"></div>
    <div class="frame-name">Wide screen</div><div class="wide" data-layout="today"></div>
  </section>
  <section class="version" data-version="proposed">
    <h2>Proposed</h2>
    <div class="frame-name">Phone</div><div class="phone" data-layout="proposed"></div>
    <div class="frame-name">Wide screen</div><div class="wide" data-layout="proposed"></div>
  </section>
</div>

<template id="tiles">
  <div class="tiles">
    <div class="tile">
      <h3>The factory now</h3>
      <p>Writing now: F198, Keep the 'plant an idea' at the top rather than having… · 3 s in</p>
      <p style="color: var(--good-ink)">Then 5 replies in line, about 17 min for all.</p>
    </div>
    <div class="tile">
      <h3 style="color: var(--opus)">The lead's window</h3>
      <div class="meter"><span style="width: 7%"></span><span class="mark"></span></div>
      <p class="small">5-hour window 7% · resets on Nov 3 03:50 · planning may go past the 75% line, the factory stops there</p>
      <div class="meter"><span style="width: 11%"></span></div>
      <p class="small">week 11% · resets on Nov 9 16:00</p>
    </div>
  </div>
</template>

<template id="coming">
  <section class="coming">
    <h2>Coming seeds · 1</h2>
    <div class="slot"><div class="item"><b>Keep the 'plant an idea' at the top rather than having…</b><span>planting at the runner's next pick</span></div></div>
  </section>
</template>

<template id="plant">
  <div class="plant">
    <h2>Plant an idea</h2>
    <label>What's on your mind? As rough as you like: the lead names the card
      <textarea rows="4" placeholder="The pause button did nothing the first time…"></textarea>
    </label>
    <div class="buttons">
      <button type="button" class="btn go">Plant</button>
      <button type="button" class="btn plain">Plant and ask the lead</button>
      <span class="status">Plant: a seed card that waits for you; write on its thread to send it to the lead. Plant and ask the lead: the lead answers it on its thread.</span>
    </div>
  </div>
</template>

<template id="desk">
  <section class="desk">
    <h2>Your desk · 6</h2>
    <div class="group"><h3>To sign off · 2</h3>
      <div class="item"><b>Phone notifications: every project, and with the dashboard closed</b><span>reviewed · waits for your sign-off</span></div>
      <div class="item"><b>Mark a card to use Claude's reserve, so only its tickets run past the mark</b><span>reviewed · waits for your sign-off</span></div>
    </div>
    <div class="group"><h3>Your answers wanted · 2</h3>
      <div class="item"><b>Plant and ask the lead comes first and yellow; Plant turns plain</b><span>the lead replied 4 s ago</span></div>
      <div class="item"><b>Each project gets its own card letter, and the factory/product area goes</b><span>the lead replied 6.2 days ago</span></div>
    </div>
    <div class="group"><h3>Proposals to review · 2</h3>
      <div class="item"><b>F133: each project has its own series letter, and the area goes</b><span>7 key points</span></div>
      <div class="item"><b>F197: Plant and ask the lead comes first and yellow</b><span>mock-up, plan · 6 key points</span></div>
    </div>
  </section>
</template>

<script>
  const part = (id) => document.getElementById(id).content.firstElementChild.cloneNode(true);
  const note = (words) => {
    const p = document.createElement("p");
    p.className = "mark-note";
    p.textContent = words;
    return p;
  };
  const row = (...children) => {
    const div = document.createElement("div");
    div.className = "row";
    div.append(...children);
    return div;
  };
  document.querySelectorAll('[data-layout="today"]').forEach((frame) => {
    frame.append(part("tiles"), part("coming"), row(part("plant"), part("desk")));
  });
  document.querySelectorAll('[data-layout="proposed"]').forEach((frame) => {
    const plant = part("plant");
    const coming = part("coming");
    plant.classList.add("changed");
    coming.classList.add("changed");
    const column = document.createElement("div");
    column.className = "plant-column";
    const holder = document.createElement("div");
    holder.append(coming, note("Coming seeds moves here: right under the box, and it no longer pushes the box down"));
    column.append(plant, holder);
    frame.append(part("tiles"), row(column, part("desk")));
  });
  document.querySelectorAll(".switch button").forEach((button) => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".switch button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      document.querySelectorAll("[data-version]").forEach((v) => { v.hidden = v.dataset.version !== button.dataset.show; });
    });
  });
</script>
</body>
</html>
