# The project's settings (ADR 30 item 3); the machine's are in ~/.config/softfield/factory.toml.
# Changing caps needs an Accepted ADR; timeouts are operational and can be tuned freely.

[project]
name = "softfield"
description = "The software factory itself: the runner, the dashboard and the workflow that build every project."

# What check-all and the gates run (ADR 30 item 3)
[checks]
test_dirs = ["tests/runner", "tests/factory_dashboard"]
test_workers = 16                       # 2026-10-21 (F71): 19.5 min alone, 6.5 on 8, 5 on 16
mypy = ["runner", "factory_dashboard", "tests"]
dependency_files = ["pyproject.toml", "uv.lock"]
dependency_dirs = ["factory_dashboard/static/vendor/"]

[checks.layouts]                        # one test file per module (ADR 00 A1)
"tests/runner" = ["runner", ".py"]
"tests/factory_dashboard" = ["factory_dashboard", ".py"]

# The review's before and after pictures (ADR 40 item 2). The exception to sample data (item 4):
# a copy of the metrics database, which the review can already read. `uv run` serves the dashboard
# of the tree it runs in, so the before draws the old one.
[shots]
prepare = '''uv run --frozen python -c "import os; from datetime import UTC, datetime; from pathlib import Path; from runner.backup import copy; from runner.config import machine_metrics_db; data = Path(os.environ['SOFTFIELD_SHOTS_DATA']); copy(machine_metrics_db(), data, datetime.now(UTC)).rename(data / 'metrics.sqlite')"'''
serve = 'uv run --frozen softfield dashboard --port {port} --db "$SOFTFIELD_SHOTS_DATA/metrics.sqlite"'
ready = "/"

[caps]
max_attempts = 3                       # per task: 1, 2 (+ gate output), 3 (fresh branch + direction)
# Headless Claude is bounded per trigger, not per milestone (ADR 12 item 10). A task past its
# limits goes to tasks/blocked/ and is named in the report.
directions_per_task = 1                 # the lead's direction before the last attempt
escalations_per_task = 2
checkpoint_every = 2                    # developer merges between checkpoint reviews
review_rounds = 3
default_max_diff = 1000                 # a backstop against rewritten files, not a sizing tool (ADR 07)

[timeouts]  # seconds
warmup = 300
opencode = 4500                         # 2026-10-13: f19-01 passed at 57 min and was cut at 59; three check-alls of 12 min each
claude = 4500                           # 2026-10-16: an escalation that does the ticket runs check-all twice (f17-01 cut at 45 min)
review = 3600                           # a milestone review: F6's (30 tickets) hit 1800 twice, 2026-10-08
gate = 1200                             # 2026-10-13: the full suite takes 750 s

[report]
narrative = false  # a headless Claude narrative per session costs Pro usage; off by default
