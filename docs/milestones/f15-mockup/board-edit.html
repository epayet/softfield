<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body style="margin:0">
<title>Board You Can Edit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: the dashboard's own board. Phone: one stage at a time, picked from a row of chips;
   wide: the stages side by side. A bar at the bottom holds the moves until they are sent. */
:root {
  color-scheme: dark;
  --floor: #12161b; --bay: #181e25; --plate: #1f2730; --rule: #303b47;
  --fg: #dfe4e8; --ink-2: #b4bec8; --muted: #8794a2;
  --hazard: #f2b10a; --hazard-ink: #1a1405; --way: #ff9640; --opus: #ff9640;
  --factory: #f2b10a; --product: #4fd1a5; --accent: #ffc48a; --new: #5fd17a; --leaf: #8ccf62;
  --display: "Chakra Petch", "Bahnschrift", "DIN Alternate", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --floor: #eceee9; --bay: #f7f8f5; --plate: #ffffff; --rule: #c3c8c0;
  --fg: #16191d; --ink-2: #3f4650; --muted: #5b636d;
  --hazard: #f2b10a; --hazard-ink: #1a1405; --way: #a4461f; --opus: #c8641a;
  --factory: #b98600; --product: #18977a; --accent: #a4461f; --new: #2c9a46; --leaf: #4c9a26;
} }
:root[data-theme="light"] {
  color-scheme: light;
  --floor: #eceee9; --bay: #f7f8f5; --plate: #ffffff; --rule: #c3c8c0;
  --fg: #16191d; --ink-2: #3f4650; --muted: #5b636d;
  --hazard: #f2b10a; --hazard-ink: #1a1405; --way: #a4461f; --opus: #c8641a;
  --factory: #b98600; --product: #18977a; --accent: #a4461f; --new: #2c9a46; --leaf: #4c9a26;
}
* { box-sizing: border-box; }
body { background: var(--floor); color: var(--fg); font: 15px/1.4 var(--body); padding-inline: 16px; padding-block: 14px 110px; }
h1 { font: 600 20px var(--display); letter-spacing: .06em; text-transform: uppercase; margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.switch { display: inline-flex; border: 1px solid var(--rule); }
.switch button { min-height: 44px; padding: 0 16px; background: var(--plate); border: 0; font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--hazard); color: var(--hazard-ink); }
.lede { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.changes { margin: 0; padding: 10px 12px 10px 28px; background: var(--bay); border: 1px dashed var(--new); font-size: 13.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.changes b { color: var(--new); font-weight: 600; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }  /* Today's stand-in: the real page stacks all six stages */
.chips button { flex: none; min-height: 44px; padding: 0 12px; background: var(--plate); border: 1px solid var(--rule); font: 600 12px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--hazard); color: var(--fg); box-shadow: inset 0 -3px 0 var(--hazard); }
.chips span { font: 500 12px var(--mono); color: var(--muted); margin-left: 4px; }
.stages { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.stage { background: var(--bay); min-width: 0; display: flex; flex-direction: column; }
.stage[hidden] { display: none; }
.stage-head { padding: 10px 12px; background: var(--plate); border-bottom: 1px solid var(--rule); }
.stage-head h2 { margin: 0; font: 600 13px var(--display); letter-spacing: .08em; text-transform: uppercase; }
.stage-head span { font: 12px var(--mono); color: var(--muted); }
.cards { display: flex; flex-direction: column; gap: 6px; padding: 8px; min-height: 60px; }
.card { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; background: var(--plate); border: 1px solid var(--rule); border-left: 4px solid var(--c, var(--muted)); }
.card.factory { --c: var(--factory); } .card.product { --c: var(--product); }
.card.bug { border-left-style: double; }
.card .body { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.meta { font: 600 11px var(--mono); color: var(--muted); }
.meta b { color: var(--fg); }
.title { font: 600 14px/1.25 var(--body); overflow-wrap: anywhere; }
.note { font-size: 12.5px; color: var(--muted); }
.note.go { color: var(--accent); }
.card code { align-self: flex-start; font: 11.5px var(--mono); background: var(--floor); color: var(--hazard); padding: 4px 6px; overflow-wrap: anywhere; }
.meter { height: 6px; background: var(--floor); } .meter i { display: block; height: 100%; background: var(--c, var(--muted)); }
.grip, .more { width: 44px; min-height: 44px; background: transparent; border: 0; color: var(--muted); cursor: grab; display: grid; place-items: center; font: 600 18px var(--mono); }
.grip { touch-action: none; border-right: 1px solid var(--rule); }
.more { cursor: pointer; border-left: 1px solid var(--rule); }
.card.moved, .card.sent { border-style: dashed; border-color: var(--way); border-left-style: solid; border-left-color: var(--c, var(--muted)); }
.card.dragging { opacity: .85; outline: 2px solid var(--hazard); z-index: 2; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
.way { font: 600 11.5px var(--mono); color: var(--way); }
.plant { display: flex; gap: 6px; padding: 8px 8px 0; }
.plant input { flex: 1; min-width: 0; min-height: 44px; padding: 0 10px; background: var(--floor); color: var(--fg); border: 1px solid var(--rule); font: 14px var(--body); }
.plant button, .bar button, .sheet button { min-height: 44px; padding: 0 14px; border: 1px solid var(--rule); background: var(--plate); font: 600 12px var(--display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bay); border-top: 2px solid var(--way); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; z-index: 5; }
.bar p { margin: 0; font-size: 13.5px; min-width: 0; flex: 1 1 200px; }
.bar .go { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard); }
.bar .demo { border-style: dashed; color: var(--muted); }
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 8; display: grid; align-items: end; }
.sheet { background: var(--bay); border-top: 1px solid var(--rule); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; max-width: 520px; width: 100%; margin: 0 auto; }
.sheet h3 { margin: 0 0 4px; font: 600 14px var(--body); }
.sheet .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sheet button { text-align: left; width: 100%; }
.sheet .row button { text-align: center; padding: 0 4px; }
.sheet small { color: var(--muted); font-size: 12px; }
.toast { font-size: 12.5px; color: var(--new); min-height: 18px; margin: 0; }
/* The field: six plots in growth order, three to a row on a phone, joined by a belt */
.plots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; padding: 12px; background: var(--bay); border: 1px solid var(--rule);
  background-image: repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--hazard) 9%, transparent) 10px 12px); }
.plot { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 6px; align-items: center; min-height: 64px; padding: 6px 8px; background: var(--plate); border: 1px solid var(--rule); color: var(--ink-2); cursor: pointer; text-align: left; }
.plot svg { grid-row: 1 / 3; width: 44px; height: 40px; color: var(--muted); }
.plot b { font: 600 20px/1 var(--display); color: var(--fg); align-self: end; }
.plot span { font: 600 10.5px var(--display); letter-spacing: .06em; text-transform: uppercase; align-self: start; overflow-wrap: anywhere; }
.plot::after { content: "›"; position: absolute; right: -12px; top: 50%; translate: 0 -50%; font: 600 16px var(--mono); color: var(--hazard); }
.plot:nth-child(3n)::after { content: none; }
.plot::before { content: ""; position: absolute; left: -1px; top: -1px; width: 8px; height: 8px; border-left: 2px solid var(--muted); border-top: 2px solid var(--muted); }
.plot[aria-pressed="true"] { border-color: var(--hazard); box-shadow: inset 0 -4px 0 var(--hazard); color: var(--fg); }
.plot[aria-pressed="true"]::before { border-color: var(--hazard); }
.plot.ripe b { color: var(--hazard); }
@media (min-width: 900px) {
  .chips { display: none; }
  .plots { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .plot:nth-child(3n)::after { content: "›"; } .plot:last-child::after { content: none; }
  .stages { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .stage[hidden] { display: flex; }
  .sheet-back { align-items: center; }
  .sheet { border: 1px solid var(--rule); }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

</div>
<div class="bar" id="bar" hidden></div>
<div id="sheet-host"></div>

;
const WORDS = {
  seed: ["Seed", "idea or set aside"], sprouting: ["Sprouting", "being planned"],
  planted: ["Planted", "tickets ready"], growing: ["Growing", "in the factory"],
  ripe: ["Ripe", "needs your sign-off"], harvested: ["Harvested", "signed off or fixed"],
};
const STAGES = Object.keys(WORDS);
const ORDERED = ["seed", "sprouting", "planted", "growing"];   // the stages you can reorder
const ARCHIVED = ["F11", "F15", "F18", "F43", "F73", "F105"];   // ideas whose conversation is archived
const WAITS = { F27: "waits for your answer since 8 Oct", F54: "waits for your answer since 9 Oct" };
const nat = k => [k.replace(/\d+.*/, ""), parseInt(k.replace(/^\D+/, ""), 10) || 0];
const byKey = (a, b) => { const [x, n] = nat(a.key), [y, m] = nat(b.key); return x < y ? -1 : x > y ? 1 : n - m; };

let mode = "proposed", shown = "planted";
let cols, base, sentOrder = null, moved = new Set(), sent = new Set(), state = "idle";  // idle | moved | sent
let planted = false;

function proposedColumns() {
  const c = {}; STAGES.forEach(s => c[s] = TODAY[s].map(x => ({ ...x })));
  const back = c.sprouting.filter(x => ARCHIVED.includes(x.key));
  c.sprouting = c.sprouting.filter(x => !ARCHIVED.includes(x.key));
  c.sprouting.forEach(x => { if (WAITS[x.key]) x.note = WAITS[x.key]; });
  back.forEach(x => x.note = "conversation archived");
  c.seed = [...c.seed, ...back].sort((a, b) => a.p - b.p || byKey(a, b));
  return c;
}
function reset() { cols = proposedColumns(); base = snapshot(); sentOrder = null; work(); }
/* The cards out of place between two orders: those outside their longest common run. A card
   put back where it was is not moved, and neither are the cards it passed. */
function outOfPlace(from, to) {
  const n = from.length, m = to.length, t = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) t[i][j] = from[i] === to[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const kept = new Set(); let i = 0, j = 0;
  while (i < n && j < m) { if (from[i] === to[j]) { kept.add(from[i]); i++; j++; } else if (t[i + 1][j] >= t[i][j + 1]) i++; else j++; }
  return to.filter(k => !kept.has(k));
}
function work() {
  const now = snapshot(); moved = new Set(); sent = new Set();
  ORDERED.forEach(s => {
    outOfPlace((sentOrder || base)[s], now[s]).forEach(k => moved.add(k));
    if (sentOrder) outOfPlace(base[s], sentOrder[s]).forEach(k => { if (!moved.has(k)) sent.add(k); });
  });
  state = moved.size ? "moved" : sent.size ? "sent" : "idle";
}
function snapshot() { const s = {}; STAGES.forEach(k => s[k] = cols[k].map(c => c.key)); return s; }
/* A plot's plant, drawn taller stage by stage; the last one is a crate. Our own drawing. */
function plant(i) {
  const soil = '<path d="M4 40h40" stroke="currentColor" stroke-width="2" stroke-dasharray="5 3"/>';
  if (i === 5) return `<svg viewBox="0 0 48 44" aria-hidden="true"><path d="M10 16h28v24H10z M10 24h28 M19 16v24 M29 16v24" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 12l8-7 8 7" fill="none" stroke="var(--leaf)" stroke-width="2"/></svg>`;
  const h = [0, 9, 16, 24, 30][i], top = 40 - h;
  let d = i === 0 ? '<ellipse cx="24" cy="37" rx="5" ry="3" fill="var(--leaf)"/>' : `<path d="M24 40V${top}" stroke="var(--leaf)" stroke-width="2.5" fill="none"/>`;
  for (let k = 0; k < i; k++) { const y = 40 - (k + 1) * (h / (i + .2)), side = k % 2 ? 1 : -1; d += `<path d="M24 ${y}q${side * 9} -7 ${side * 13} 1q${side * -7} 5 ${side * -13} -1z" fill="var(--leaf)"/>`; }
  if (i === 4) d += `<circle cx="24" cy="${top - 2}" r="5.5" fill="var(--hazard)"/>`;
  return `<svg viewBox="0 0 48 44" aria-hidden="true">${soil}${d}</svg>`;
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function toast(text) { document.getElementById("toast").textContent = text; }

function card(c, stage, i) {
  const proposed = mode === "proposed", can = proposed && ORDERED.includes(stage);
  const a = el("div", `card ${c.area}${c.bug ? " bug" : ""}`); a.dataset.key = c.key;
  if (moved.has(c.key)) a.classList.add("moved");
  if (sent.has(c.key)) a.classList.add("sent");
  if (can) { const g = el("button", "grip", "⠿"); g.type = "button"; g.setAttribute("aria-label", `Drag ${c.key}`); g.addEventListener("pointerdown", e => startDrag(e, a, stage)); a.append(g); }
  else a.append(el("span"));
  const b = el("div", "body"), meta = el("span", "meta");
  const place = can ? `#${i + 1}` : (!proposed && !["ripe", "harvested"].includes(stage) ? `P${c.p}` : "");
  if (place) { meta.append(el("b", "", place), " "); }
  meta.append(`${c.key} · ${c.bug ? "bug · " : ""}${c.area}`);
  b.append(meta, el("span", "title", c.title || c.key));
  if (c.total && stage !== "harvested") {
    const m = el("span", "meter"), bar = el("i"); bar.style.width = Math.round(100 * c.done / c.total) + "%"; m.append(bar);
    b.append(m, el("span", "note", `${c.done} of ${c.total} ticket${c.total === 1 ? "" : "s"}${c.aside ? ` · ${c.aside} set aside` : ""}`));
  }
  if (c.note) b.append(el("span", "note", c.note));
  if (stage === "ripe" && !c.bug) b.append(proposed ? el("span", "note go", "Read the review and sign off ›") : el("code", "", `uv run runner signoff ${c.key.toLowerCase()}`));
  if (moved.has(c.key)) b.append(el("span", "way", "moved · not sent yet"));

function render() {
  const proposed = mode === "proposed", data = proposed ? cols : TODAY;
  document.getElementById("see-today").setAttribute("aria-pressed", String(!proposed));
  document.getElementById("see-proposed").setAttribute("aria-pressed", String(proposed));
  document.getElementById("lede").textContent = proposed
    ? "Drag a card by its grip, or use ⋯, to change the order inside a stage. Nothing is sent until you press Send new order; the runner follows it from its next pick."
    : "The board as it is today: read-only. Order is changed with ↑ and ↓ on other pages, one press at a time.";
  const ch = document.getElementById("changes"); ch.hidden = !proposed; ch.replaceChildren();
  if (proposed) [["Order", "a grip and a place (#1, #2…) on each card, in place of P numbers."], ["One send", "moves wait in the bar at the bottom until you send them."],
    ["Actions", "⋯ on a card: move, open its conversation, set aside, sign off."], ["Sprouting", "only open conversations, saying who they wait for; six archived ones are seeds again."],
    ["Ripe", "\"Read the review and sign off\" in place of a terminal command."], ["The field", "the six stages as one growing row; tap a plot to open it. Nothing scrolls sideways."]]
    .forEach(([b, t]) => { const li = el("li"); li.append(el("b", "", b + ": "), t); ch.append(li); });
  const chips = document.getElementById("chips"); chips.replaceChildren();
  chips.className = proposed ? "plots" : "chips";
  STAGES.forEach((s, i) => {
    const b = el("button", proposed ? "plot" : ""); b.type = "button"; b.setAttribute("aria-pressed", String(s === shown)); b.addEventListener("click", () => { shown = s; render(); });
    if (proposed) { b.innerHTML = plant(i); b.append(el("b", "", String(data[s].length)), el("span", "", WORDS[s][0])); if (s === "ripe" && data[s].length) b.classList.add("ripe"); }
    else { b.textContent = WORDS[s][0]; b.append(el("span", "", String(data[s].length))); }
    chips.append(b);
  });
  const host = document.getElementById("stages"); host.replaceChildren();
  STAGES.forEach(s => {
    const sec = el("section", "stage"); sec.hidden = s !== shown; sec.dataset.stage = s;
    const head = el("div", "stage-head"); head.append(el("h2", "", WORDS[s][0]), el("span", "", `${WORDS[s][1]} · ${data[s].length}`)); sec.append(head);
    const list = el("div", "cards"); data[s].forEach((c, i) => list.append(card(c, s, i))); sec.append(list); host.append(sec);
  });
  bar();
}

function bar() {
  const b = document.getElementById("bar"); b.replaceChildren(); b.hidden = mode !== "proposed" || state === "idle";
  if (b.hidden) return;
  const p = el("p"), btn = (cls, text, fn) => { const x = el("button", cls, text); x.type = "button"; x.addEventListener("click", fn); return x; };
  if (state === "moved") {
    p.textContent = `${moved.size} card${moved.size === 1 ? "" : "s"} moved. Nothing is sent yet.`;
    b.append(p, btn("", "Cancel", () => { const back = sentOrder || base; ORDERED.forEach(s => cols[s].sort((a, b) => back[s].indexOf(a.key) - back[s].indexOf(b.key))); work(); toast("Moves cancelled."); render(); }),
      btn("go", "Send new order", () => { sentOrder = snapshot(); work(); toast(""); render(); }));
  } else {
    p.textContent = "New order sent. The runner applies it at its next pick; the job running now is not interrupted. You can still move cards and send again.";
    b.append(p, btn("demo", "Mock-up only: runner's next pick", () => { base = sentOrder; sentOrder = null; work(); toast("Applied by the runner in one commit. The dashed edges are gone and the order stays."); render(); }));
  }
}

function place(stage, key, to) {
  const list = cols[stage], from = list.findIndex(c => c.key === key);
  to = Math.max(0, Math.min(list.length - 1, to)); if (from < 0 || from === to) return;
  const [c] = list.splice(from, 1); list.splice(to, 0, c); work(); toast(state === "idle" ? "Back where it was: nothing to send." : ""); render();
}

function sheet(c, stage) {
  const host = document.getElementById("sheet-host"), back = el("div", "sheet-back"), s = el("div", "sheet");
  const close = () => host.replaceChildren();
  const act = (text, fn) => { const b = el("button", "", text); b.type = "button"; b.addEventListener("click", () => { close(); fn(); }); return b; };
  s.append(el("h3", "", `${c.key} · ${c.title || ""}`));
  if (ORDERED.includes(stage)) {
    const i = cols[stage].findIndex(x => x.key === c.key), row = el("div", "row");
    row.append(act("Top", () => place(stage, c.key, 0)), act("Up", () => place(stage, c.key, i - 1)), act("Down", () => place(stage, c.key, i + 1)), act("Bottom", () => place(stage, c.key, cols[stage].length - 1)));
    s.append(el("small", "", "Move in this stage"), row);
  }
  const say = t => () => toast(t);
  if (stage === "ripe") s.append(act("Read the review and sign off", say(`In the real page: ${c.key}'s review, at its Sign off button.`)));
  if (!c.bug) s.append(act("Open its conversation", say(`In the real page: the planning thread of ${c.key}.`)));
  if (["seed", "sprouting"].includes(stage)) s.append(act("Set aside", say(`${c.key} set aside: it leaves the board's open stages and waits under Set aside in Planning.`)));
  s.append(act("Open the card", say(`In the real page: ${c.key}'s own page, with its tickets.`)), act("Close", () => {}));
  back.append(s); back.addEventListener("click", e => { if (e.target === back) close(); }); host.replaceChildren(back);
}

/* Drag: the card follows the finger; a line shows where it will land; the page scrolls near its edges. */
let drag = null;
function startDrag(e, node, stage) {
  e.preventDefault();
  drag = { node, stage, y0: e.clientY, s0: window.scrollY, y: e.clientY, to: null };
  node.classList.add("dragging");
  window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", endDrag); window.addEventListener("pointercancel", endDrag);
  requestAnimationFrame(tick);

function onMove(e) { if (drag) { drag.y = e.clientY; e.preventDefault(); } }
function tick() {
  if (!drag) return;
  const edge = 90, h = window.innerHeight;
  if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 6)); else if (drag.y > h - edge - 40) window.scrollBy(0, Math.ceil((drag.y - (h - edge - 40)) / 6));

  const after = others.find(n => { const r = n.getBoundingClientRect(); return drag.y < r.top + r.height / 2; });
  if (after) after.style.boxShadow = "0 -4px 0 var(--hazard)"; else if (others.length) others[others.length - 1].style.boxShadow = "0 4px 0 var(--hazard)";

  if (!drag) return;
  const { node, stage, to } = drag; drag = null;
  window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", endDrag); window.removeEventListener("pointercancel", endDrag);
  const key = node.dataset.key, list = cols[stage].filter(c => c.key !== key);
  const at = to === null ? list.length : list.findIndex(c => c.key === to);
  const now = cols[stage].findIndex(c => c.key === key);
  if (at === now) { render(); return; }
  place(stage, key, at);
}

document.getElementById("see-today").addEventListener("click", () => { mode = "today"; render(); });
document.getElementById("see-proposed").addEventListener("click", () => { mode = "proposed"; render(); });
