[project]
name = "softfield"
version = "0.1.0"
description = "A software factory: a frontier lead plans, local and cloud developers build, one runner gates and merges, for every project on this machine."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
softfield = "runner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "pytest-playwright>=0.5",  # the dashboard's pages on a phone and a wide screen
    "playwright==1.63.0",  # the browsers installed in ~/.cache/ms-playwright
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner", "factory_dashboard"]

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md"]  # Markdown never gates code (ADR 01, item 2)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ", "PT", "TID"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # emoji and typographic characters are intentional
    "PT018",   # compound asserts are fine in tests
    "S603",    # subprocess with argument lists is used deliberately (runner, serve, tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S310", "S311", "S607", "DTZ001"]
"runner/**" = ["S607"]  # the runner calls git, uv, opencode and claude from PATH

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
